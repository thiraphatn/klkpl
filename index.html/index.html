<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#66bb6a">
  <meta name="description" content="เกมฟาร์มปลูกผัก เก็บเกี่ยว ขาย และตกแต่งฟาร์ม">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>ฟาร์มสุขใจ</title>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🌾 ฟาร์มสุขใจ</h1>
      <p id="dayText">วันที่ 1 • ฟาร์มของฉัน</p>
    </div>
    <div class="top-right"><button id="soundBtn" class="sound-btn" aria-label="เปิด/ปิดเสียง">🔊</button><div class="money">💰 <span id="money">100</span></div></div>
  </header>

  <main>
    <section class="stats">
      <div>🌱 แปลงว่าง <b id="emptyCount">9</b></div>
      <div>🥕 ผักพร้อมเก็บ <b id="readyCount">0</b></div>
      <button id="installBtn" class="install hidden">ติดตั้งแอป</button>
    </section>

    <section class="farm-card">
      <div class="farm-title">
        <h2>🌻 แปลงผัก</h2>
        <span id="message">แตะแปลงเพื่อปลูกผัก</span>
      </div>
      <div id="scene" class="scene">
        <div id="fx" class="fx"></div>
        <div id="themeBadge" class="theme-badge"></div>
        <div id="decoTop" class="ring top"></div>
        <div id="decoLeft" class="ring left"></div>
        <div id="farm" class="farm-grid"></div>
        <div id="decoRight" class="ring right"></div>
        <div id="decoBottom" class="ring bottom"></div>
      </div>
    </section>

    <section class="shop-section">
      <h2>🛒 ร้านขายเมล็ดพันธุ์</h2>
      <div id="seedFilters" class="chips"></div>
      <div id="seedShop" class="cards"></div>
    </section>

    <section class="decoration-section">
      <h2>🎨 ร้านธีมตกแต่งฟาร์ม</h2>
      <p class="hint">ซื้อธีมเพื่อเปลี่ยนบรรยากาศรอบๆ ฟาร์ม ซื้อแล้วสลับใช้ได้ตลอด</p>
      <div id="themeShop" class="cards"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close">×</button>
      <h2 id="modalTitle">แปลงผัก</h2>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
